[project]
name = "silpo-mcp"
version = "0.1.0"
description = "Typed Python client for the official Silpo MCP server (https://mcp.silpo.ua/mcp)"
readme = "README.md"
authors = [
    { name = "Oleksii", email = "doubledare704@gmail.com" }
]
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["mcp", "silpo", "client", "ai-factory", "groceries"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp==3.4.7",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "key-value>=0.1",
    "diskcache>=5.6",
    "pathvalidate>=3.2",
    "cryptography>=42",
]

[project.optional-dependencies]
examples = []

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
python-version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
]
